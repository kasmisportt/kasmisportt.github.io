<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto - kasmisport</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            padding:40px;
        }

        .producto-container{
            max-width:1100px;
            margin:auto;
            background:white;
            border-radius:25px;
            overflow:hidden;
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:40px;
            padding:40px;
            box-shadow:0 10px 30px rgba(0,0,0,0.1);
        }

        .producto-imagen img{
            width:100%;
            border-radius:20px;
            object-fit:cover;
        }

        .producto-info{
            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        .marca{
            background:black;
            color:white;
            width:max-content;
            padding:8px 18px;
            border-radius:30px;
            margin-bottom:20px;
            font-size:14px;
        }

        .producto-titulo{
            font-size:42px;
            margin-bottom:20px;
        }

        .producto-descripcion{
            color:#555;
            line-height:1.7;
            margin-bottom:25px;
            font-size:18px;
        }

        .producto-precio{
            font-size:40px;
            font-weight:bold;
            color:#1faa59;
            margin-bottom:30px;
        }

        .botones{
            display:flex;
            gap:15px;
            flex-wrap:wrap;
        }

        .btn{
            padding:16px 28px;
            border:none;
            border-radius:12px;
            cursor:pointer;
            font-size:16px;
            font-weight:bold;
            transition:0.3s;
        }

        .btn-whatsapp{
            background:#25D366;
            color:white;
        }

        .btn-whatsapp:hover{
            transform:scale(1.05);
        }

        .btn-volver{
            background:#111;
            color:white;
        }

        .btn-volver:hover{
            transform:scale(1.05);
        }

        .producto-no-encontrado{
            text-align:center;
            margin-top:100px;
        }

        @media(max-width:900px){

            .producto-container{
                grid-template-columns:1fr;
            }

            .producto-titulo{
                font-size:32px;
            }

        }

    </style>
</head>
<body>

<div id="contenidoProducto"></div>

<script src="productos.js"></script>

<script>

    // Obtener ID de la URL
    const params =
    new URLSearchParams(window.location.search);

    const id =
    parseInt(params.get("id"));

    // Buscar producto
    const producto =
    productos.find(p => p.id === id);

    // Contenedor
    const contenedor =
    document.getElementById("contenidoProducto");

    // Si existe el producto
    if(producto){

        contenedor.innerHTML = `

        <div class="producto-container">

            <div class="producto-imagen">

                <img src="${producto.imagen}"
                     alt="${producto.nombre}">

            </div>

            <div class="producto-info">

                <div class="marca">
                    ${producto.marca}
                </div>

                <h1 class="producto-titulo">
                    ${producto.nombre}
                </h1>

                <p class="producto-descripcion">
                    ${producto.descripcion}
                </p>

                <div class="producto-precio">
                    ${producto.precio}
                </div>

                <div class="botones">

                    <button
                        class="btn btn-whatsapp"
                        onclick="comprarProducto()">

                        🛒 Comprar por WhatsApp

                    </button>

                    <button
                        class="btn btn-volver"
                        onclick="volverInicio()">

                        ← Volver

                    </button>

                </div>

            </div>

        </div>

        `;

    } else {

        contenedor.innerHTML = `

        <div class="producto-no-encontrado">

            <h1>Producto no encontrado</h1>

            <br>

            <button
                class="btn btn-volver"
                onclick="volverInicio()">

                ← Volver al inicio

            </button>

        </div>

        `;

    }

    // Comprar
    function comprarProducto(){

        const mensaje =
        `Hola kasmisport 👋 Estoy interesado en comprar: ${producto.nombre}`;

        const url =
        `https://wa.me/573185418060?text=${encodeURIComponent(mensaje)}`;

        window.open(url, '_blank');

    }

    // Volver
    function volverInicio(){

        window.location.href = "index.html";

    }

</script>

</body>
</html>
